  <circle cx="322" cy="128" r="19" fill="#16A34A"/>
  <path d="M313 128 L320 135 L331 121" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="322" cy="128" r="27" fill="none" stroke="#16A34A" stroke-width="2" opacity=".35"/>
