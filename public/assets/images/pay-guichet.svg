    <rect x="22" y="66" width="24" height="24" fill="#fff"/><rect x="28" y="72" width="12" height="12" fill="#0B2A5B"/>
    <rect x="52" y="52" width="10" height="10" fill="#fff"/><rect x="68" y="58" width="10" height="10" fill="#fff"/><rect x="52" y="72" width="10" height="10" fill="#fff"/>
    <rect x="78" y="74" width="12" height="12" fill="#fff"/><rect x="62" y="84" width="8" height="8" fill="#fff"/><rect x="52" y="28" width="8" height="8" fill="#fff"/>
